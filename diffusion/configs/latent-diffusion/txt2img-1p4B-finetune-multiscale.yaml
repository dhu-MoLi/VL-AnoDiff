model:
  base_learning_rate: 1.0e-4
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "image"
    cond_stage_key: "caption"
    image_size: 64
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False
    # Add missing configuration
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_heads: 8
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 1280
        use_checkpoint: true
        legacy: False
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    
    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
      params: {}  # Ensure this is an empty dict, not None
      # params:
      # # n_embed: 1280
      # version: "openai/clip-vit-large-patch14"
      # device: "cuda"
      # max_length: 77
      #   use_additional_embeddings: True
    # Multi-scale training configuration
    personalization_config:
      target: ldm.modules.embedding.multiscale_embedding_manager.MultiScaleEmbeddingManager
      params:
        placeholder_strings: ["*"]
        initializer_words: ["defect"]
        per_image_tokens: false
        num_vectors_per_scale: 5
        scales: 3
        initial_scale_weights: [0.4, 0.4, 0.2]
        embedding_dim: 768
        progressive_training: true
        progressive_steps: [0, 500, 1000]

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 4
    wrap: False
    train:
      target: ldm.data.personalized.PersonalizedBase
      params:
        size: 512
        set: "train"
        per_image_tokens: false
        repeats: 100
        data_root: "data/defect"
    validation:
      target: ldm.data.personalized.PersonalizedBase
      params:
        size: 512
        set: "val"
        per_image_tokens: false
        repeats: 10
        data_root: "data/defect"

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 500
        max_images: 8
        increase_log_steps: True
    
    # Multi-scale training callback
    multiscale_callback:
      target: ldm.modules.embedding.multiscale_callback.MultiScaleTrainingCallback
      params:
        progressive_steps: [0, 500, 1000]